name: Daily SHEIN Deal Tracker

# This schedules the script to run every day at 8:00 AM IST (02:30 UTC)
on:
  schedule:
    - cron: '30 2 * * *' 
  workflow_dispatch: # This allows you to click a "Run" button manually anytime

jobs:
  scrape_shein:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
          
      - name: Run Tracker Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python shein_tracker.py

