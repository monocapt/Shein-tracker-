name: Daily SHEIN Deal Tracker

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_KEY }}
  TELEGRAM_CHAT_ID: ${{ secrets.MY_CHAT_ID }}

jobs:
  scrape_shein:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium
          
      - name: Run Tracker Script
        run: python shein_tracker.py
